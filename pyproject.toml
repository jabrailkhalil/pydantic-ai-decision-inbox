[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-decision-inbox"
version = "0.1.0"
description = "An independent SQLite decision-inbox and crash-recovery experiment for PydanticAI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "jabrailkhalil"}]
dependencies = ["pydantic-ai-slim==2.63.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "ruff>=0.12", "mypy>=1.19", "build>=1.2"]

[project.scripts]
decision-inbox = "pydantic_ai_decision_inbox.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".venv*", "node_modules", "dist", "demo-work"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.11"
strict = true
[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = ["subprocess: verifies a real process boundary, crash or concurrent process"]
